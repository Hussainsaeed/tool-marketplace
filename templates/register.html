<!DOCTYPE html>
<html>
<head>
    <title>إنشاء حساب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #0F0E1A; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1A1735; padding: 40px; border-radius: 10px; width: 400px; }
        h1 { text-align: center; margin-bottom: 30px; color: #FFD700; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #0F0E1A; color: white; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #FFD700; color: #0F0E1A; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #F0A500; }
        .link { text-align: center; margin-top: 15px; color: #A8A8C8; }
        .link a { color: #FFD700; text-decoration: none; }
        .flash { padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center; }
        .flash.success { background: #00C897; color: white; }
        .flash.error { background: #FF6B6B; color: white; }
        .role-selector { display: flex; gap: 20px; margin: 10px 0; }
        .role-selector label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 إنشاء حساب</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="email" name="email" placeholder="البريد الإلكتروني" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <div class="role-selector">
                <label><input type="radio" name="role" value="buyer" checked> 🛒 مشتري</label>
                <label><input type="radio" name="role" value="seller"> 🏪 بائع</label>
            </div>
            <button type="submit" class="btn">إنشاء الحساب</button>
        </form>
        <div class="link">لديك حساب؟ <a href="/login">تسجيل الدخول</a></div>
    </div>
</body>
</html>
